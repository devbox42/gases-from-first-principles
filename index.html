<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An animated, narrated study course through the research of Robert Hellmann: computing gas properties from quantum mechanics.">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gases from First Principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lab-notebook course. Home = cover + chapter shelf + reading list; lesson = 16:9 graph-paper stage, caption strip and transport bar below. */
:root{
  --paper:#edf1f3; --sheet:#f8fafb; --grid:#d5dee4; --ink:#17263a; --ink-2:#4a5b70; --rule:#c3ced7;
  --he:#d9822b; --ne:#c2417f; --ar:#7b52c4; --kr:#5f7b93; --xe:#138a8a; --rep:#d23c2a; --att:#2f62d6;
  --good:#2f8a57; --bad:#c23b3b;
  --display:"Newsreader","Iowan Old Style","Georgia",serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --radius:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1722; --sheet:#141e2b; --grid:#1f2c3c; --ink:#e4ebf2; --ink-2:#9eb0c3; --rule:#2c3b4e;
  --he:#f2a65a; --ne:#f07aa8; --ar:#b28cf0; --kr:#a9c0d4; --xe:#3cc7b8; --rep:#ff6f52; --att:#6ea6ff; --good:#5cc489; --bad:#ff7a7a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1722; --sheet:#141e2b; --grid:#1f2c3c; --ink:#e4ebf2; --ink-2:#9eb0c3; --rule:#2c3b4e;
  --he:#f2a65a; --ne:#f07aa8; --ar:#b28cf0; --kr:#a9c0d4; --xe:#3cc7b8; --rep:#ff6f52; --att:#6ea6ff; --good:#5cc489; --bad:#ff7a7a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--body);padding-inline:16px;padding-block:0 48px}
a{color:var(--att)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--att);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--mono)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
.eyebrow{font:500 11.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding-block:14px;border-bottom:1px solid var(--rule);margin-bottom:28px;flex-wrap:wrap}
.top .brand{font:600 18px/1 var(--display);text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.top .brand svg{flex:none}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a,.top nav button{font:500 13px/1 var(--body);color:var(--ink-2);text-decoration:none;padding:8px 10px;border-radius:var(--radius);background:none;border:0;cursor:pointer}
.top nav a:hover,.top nav button:hover{color:var(--ink);background:var(--sheet)}

/* ---------- home ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:8px 36px}
.cover h1{font-size:clamp(38px,6vw,68px);font-weight:400;letter-spacing:-.01em}
.cover h1 em{font-style:italic;color:var(--he)}
.cover p.lede{font:400 19px/1.55 var(--display);color:var(--ink-2);max-width:34em;margin:18px 0 0}
.cover .meta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.chip{font:500 12px/1 var(--mono);padding:7px 10px;border:1px solid var(--rule);border-radius:99px;color:var(--ink-2);background:var(--sheet)}
.cover .ladder{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:8px;min-width:0}
.cover .ladder svg{display:block;width:100%;height:auto}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--body);padding:12px 16px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.section-h{display:flex;align-items:baseline;gap:14px;margin:44px 0 16px;flex-wrap:wrap}
.section-h h2{font-size:30px;font-weight:400}
.section-h p{margin:0;color:var(--ink-2);max-width:60ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.unit{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .15s,border-color .15s}
.unit:hover{transform:translateY(-2px);border-color:var(--ink-2)}
.unit svg{display:block;width:100%;height:auto;border-bottom:1px solid var(--rule);background:var(--paper)}
.unit .u-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.unit h3{font-size:20px;font-weight:600}
.unit p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
.unit .u-foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;font:500 11.5px/1 var(--mono);color:var(--ink-2)}
.unit .done{color:var(--good)}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;min-width:0}
.reading{border-top:1px solid var(--rule)}
.reading details{border-bottom:1px solid var(--rule);padding-block:12px}
.reading summary{cursor:pointer;font:600 17px/1.3 var(--display);list-style:none;display:flex;gap:12px;align-items:baseline}
.reading summary::-webkit-details-marker{display:none}
.reading summary .n{font:500 12px/1 var(--mono);color:var(--ink-2);min-width:2.2em}
.reading ol{margin:10px 0 4px;padding-left:2.2em;display:flex;flex-direction:column;gap:8px}
.reading li{font-size:14px}
.reading li .j{color:var(--ink-2)}
.reading li .why{display:block;color:var(--ink-2);font-size:13px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.gloss div{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px}
.gloss b{font-family:var(--display);font-size:16px;display:block;margin-bottom:2px}
.gloss span{font-size:13.5px;color:var(--ink-2)}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--rule);margin-left:6px}
.timeline div{padding:0 0 14px 18px;position:relative}
.timeline div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--he)}
.timeline b{font:500 12.5px/1 var(--mono);color:var(--he);display:block;margin-bottom:3px}
.timeline span{font-size:14px}

/* ---------- trailer reel ---------- */
.reel{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#03060c;box-shadow:0 18px 50px rgba(5,10,20,.35);max-width:100%}
.reel-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.reel-play{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:12px;padding:12px 20px 12px 14px;border-radius:99px;border:1px solid rgba(242,166,90,.6);background:rgba(3,6,12,.72);color:#e8eef6;font:600 14px/1 var(--body);cursor:pointer;backdrop-filter:blur(6px);transition:opacity .3s}
.reel-play:hover{border-color:#f2a65a}
.reel-tri{width:30px;height:30px;border-radius:50%;background:#f2a65a;position:relative;flex:none}
.reel-tri::after{content:"";position:absolute;left:11px;top:8px;border-left:11px solid #03060c;border-top:7px solid transparent;border-bottom:7px solid transparent}
.reel.is-playing .reel-play{opacity:0;pointer-events:none}
.reel-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.reel-prog{height:100%;width:0;background:#f2a65a}

/* ---------- lesson ---------- */
.lesson-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.lesson-h h1{font-size:clamp(24px,3.4vw,36px);font-weight:400}
.lesson-h .eyebrow{margin-bottom:6px}
.lesson-h .right{margin-left:auto;display:flex;gap:8px}
.stagebox{position:relative;width:100%;aspect-ratio:16/9;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;max-width:100%}
.stagebox>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none;container-type:inline-size}
.overlay>*{pointer-events:auto}
.panel:empty{display:none}
.panel{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.qcard{background:var(--sheet);border:1px solid var(--ink-2);border-radius:var(--radius);padding:16px 20px;font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:12px;min-width:0}
.qcard .qk{font:500 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--he)}
.qcard .qq{font:500 20px/1.35 var(--display);max-width:60ch}
.qcard .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.qcard .opt{text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper);cursor:pointer;line-height:1.4}
.qcard .opt:hover{border-color:var(--ink-2)}
.qcard .opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper))}
.qcard .opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.qcard .fb{padding:10px 14px;border-radius:var(--radius);border-left:3px solid var(--ink-2);background:var(--paper);max-width:75ch}
.qcard .fb.ok{border-color:var(--good)}
.qcard .fb.no{border-color:var(--bad)}
.qcard .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qcard input[type=text]{font:500 17px/1 var(--mono);padding:9px 11px;width:9em;max-width:100%;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper);color:var(--ink)}
.qcard .go{font:600 14px/1 var(--body);padding:11px 16px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-flex}
.qcard .go.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.qcard .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.qcard input[type=range]{width:100%;accent-color:var(--he)}
.qcard label{font:500 13px/1.2 var(--mono);color:var(--ink-2);display:flex;justify-content:space-between;gap:1em}
.caption{min-height:4.6em;margin-top:12px;font:400 clamp(16px,1.9vw,20px)/1.5 var(--display);color:var(--ink);max-width:70ch}
.caption .who{font:500 11px/1 var(--mono);letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase;display:block;margin-bottom:6px}
.transport{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule);flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:38px;padding:0 12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--sheet);cursor:pointer;font:500 13px/1 var(--body)}
.tbtn:hover{border-color:var(--ink-2)}
.tbtn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:96px}
.tbtn[aria-pressed="true"]{border-color:var(--he);color:var(--he)}
.beats{display:flex;gap:4px;flex:1;min-width:160px;align-items:center}
.beats button{flex:1;height:8px;border-radius:4px;border:0;background:var(--rule);cursor:pointer;padding:0;min-width:6px}
.beats button.past{background:var(--ink-2)}
.beats button.now{background:var(--he)}
.beats button.q{background:transparent;box-shadow:inset 0 0 0 2px var(--rule)}
.beats button.q.past{box-shadow:inset 0 0 0 2px var(--ink-2)}
.beats button.q.now{box-shadow:inset 0 0 0 2px var(--he)}
.beatname{font:500 12px/1 var(--mono);color:var(--ink-2);min-width:8em;text-align:right}
.below{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;margin-top:22px}
.below .card h3{font-size:18px;margin-bottom:8px}
.below .card ol{margin:0;padding-left:1.3em;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.below .card li span{color:var(--ink-2)}
.kbd{font:500 11px/1 var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--ink-2)}

/* ---------- SVG stage styles ---------- */
.stage text{fill:var(--ink);font-family:var(--body)}
.stage .t-disp{font-family:var(--display)}
.stage .t-mono{font-family:var(--mono)}
.stage .muted{fill:var(--ink-2)}
.stage .gridline{stroke:var(--grid);stroke-width:1}
.stage .axis{stroke:var(--ink-2);stroke-width:2.5;fill:none}
.stage .tick{fill:var(--ink-2);font:500 22px var(--mono)}
.stage .ink{stroke:var(--ink);fill:none}
.stage .fill-sheet{fill:var(--sheet)}
.stage .fill-paper{fill:var(--paper)}
.stage .stroke-rule{stroke:var(--rule)}
.stage .he{stroke:var(--he)} .stage .f-he{fill:var(--he)}
.stage .ne{stroke:var(--ne)} .stage .f-ne{fill:var(--ne)}
.stage .ar{stroke:var(--ar)} .stage .f-ar{fill:var(--ar)}
.stage .kr{stroke:var(--kr)} .stage .f-kr{fill:var(--kr)}
.stage .xe{stroke:var(--xe)} .stage .f-xe{fill:var(--xe)}
.stage .good{stroke:var(--good)} .stage .f-good{fill:var(--good)}
.stage .rep{stroke:var(--rep)} .stage .f-rep{fill:var(--rep)}
.stage .att{stroke:var(--att)} .stage .f-att{fill:var(--att)}
.stage .bad{stroke:var(--bad)} .stage .f-bad{fill:var(--bad)}
.stage .pick{cursor:pointer}
.stage .pick:hover{filter:brightness(1.15)}
.stage text.f-he{fill:var(--he)} .stage text.f-ne{fill:var(--ne)} .stage text.f-ar{fill:var(--ar)} .stage text.f-xe{fill:var(--xe)} .stage text.f-good{fill:var(--good)} .stage text.f-bad{fill:var(--bad)} .stage text.f-kr{fill:var(--kr)} .stage text.f-rep{fill:var(--rep)} .stage text.f-att{fill:var(--att)}

@media (max-width:860px){
  .cover,.two,.below{grid-template-columns:minmax(0,1fr)}
  .beatname{display:none}
}
@media (prefers-reduced-motion: reduce){ .unit{transition:none} }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ===================== engine ===================== */
const NS = 'http://www.w3.org/2000/svg';
const W = 1600, H = 900;
const CH = [];            // chapters register themselves here
const store = {
  get(k, d) { try { const v = localStorage.getItem('gfp:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gfp:' + k, JSON.stringify(v)); } catch (e) {} }
};
const REDUCE = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

function hx(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function sv(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const fmt = (x, d = 2) => Number(x).toFixed(d).replace('-', '−');

/* Unicode sub/superscript digits -> tspans, so every font renders them small and shifted */
const SUBS = '₀₁₂₃₄₅₆₇₈₉', SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹⁻';
function scriptfix(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/[₀-₉]+/g, m => '<tspan baseline-shift="sub" font-size="70%">' + [...m].map(c => SUBS.indexOf(c)).join('') + '</tspan>')
            .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, m => '<tspan baseline-shift="super" font-size="70%">' + [...m].map(c => { const k = SUPS.indexOf(c); return k === 10 ? '−' : k; }).join('') + '</tspan>');
}
/* ---------- Stage API, handed to every scene and action ---------- */
const S = {
  gen: 0, fast: false, svg: null, g: null, ov: null,
  clear() { this.g.replaceChildren(); this.ov.replaceChildren(); const pn = document.getElementById('panel'); if (pn) pn.replaceChildren(); },
  el(tag, a = {}, parent) {
    const { hide, parent: p, ...rest } = a;
    const e = sv(tag, rest, parent || p || this.g);
    if (hide) e.style.opacity = 0;
    return e;
  },
  group(a = {}) { return this.el('g', a); },
  text(x, y, str, o = {}) {
    const { size = 34, anchor = 'start', weight, cls = '', italic, ...rest } = o;
    return this.el('text', {
      x, y, 'font-size': size, 'text-anchor': anchor, 'font-weight': weight,
      'font-style': italic ? 'italic' : null, class: cls, html: scriptfix(str), ...rest
    });
  },
  line(x1, y1, x2, y2, o = {}) { const { w = 3, cls = 'ink', ...r } = o; return this.el('line', { x1, y1, x2, y2, 'stroke-width': w, class: cls, 'stroke-linecap': 'round', ...r }); },
  circle(cx, cy, r, o = {}) { return this.el('circle', { cx, cy, r, ...o }); },
  rect(x, y, w, h, o = {}) { return this.el('rect', { x, y, width: w, height: h, ...o }); },
  path(d, o = {}) { const { w = 4, cls = 'ink', ...r } = o; return this.el('path', { d, 'stroke-width': w, class: cls, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...r }); },
  tween(ms, fn) {
    const gen = this.gen;
    if (this.fast || REDUCE || ms <= 0) { fn(1, 1); return Promise.resolve(); }
    return new Promise(res => {
      const t0 = performance.now();
      const step = now => {
        if (gen !== S.gen) return res();
        const t = clamp((now - t0) / ms, 0, 1);
        fn(ease(t), t);
        t < 1 ? requestAnimationFrame(step) : res();
      };
      requestAnimationFrame(step);
    });
  },
  wait(ms) { const gen = this.gen; if (this.fast) return Promise.resolve(); return new Promise(r => setTimeout(r, gen === S.gen ? ms : 0)); },
  fadeIn(e, ms = 500) { if (Array.isArray(e)) return Promise.all(e.map(x => this.fadeIn(x, ms))); const o0 = +(e.style.opacity || 0); return this.tween(ms, t => e.style.opacity = lerp(o0, 1, t)); },
  fadeOut(e, ms = 400) { if (Array.isArray(e)) return Promise.all(e.map(x => this.fadeOut(x, ms))); const o0 = +(e.style.opacity === '' ? 1 : e.style.opacity); return this.tween(ms, t => e.style.opacity = lerp(o0, 0, t)); },
  to(e, ms, attrs) {   // tween numeric attributes
    const from = {}; for (const k in attrs) from[k] = parseFloat(e.getAttribute(k)) || 0;
    return this.tween(ms, t => { for (const k in attrs) e.setAttribute(k, lerp(from[k], attrs[k], t)); });
  },
  move(e, x, y, ms = 600) {
    const x0 = +(e.dataset.tx || 0), y0 = +(e.dataset.ty || 0);
    e.dataset.tx = x; e.dataset.ty = y;
    return this.tween(ms, t => e.setAttribute('transform', `translate(${lerp(x0, x, t)},${lerp(y0, y, t)})`));
  },
  place(e, x, y) { e.dataset.tx = x; e.dataset.ty = y; e.setAttribute('transform', `translate(${x},${y})`); return e; },
  drawOn(e, ms = 900) {
    let L = 2000; try { L = e.getTotalLength(); } catch (err) {}
    e.style.opacity = 1;
    e.style.strokeDasharray = L; e.style.strokeDashoffset = L;
    return this.tween(ms, t => e.style.strokeDashoffset = L * (1 - t)).then(() => { e.style.strokeDasharray = ''; e.style.strokeDashoffset = ''; });
  },
  /* axes: box {x,y,w,h}; xr,yr ranges; returns mappers */
  axes(box, o = {}) {
    const { xr = [0, 1], yr = [0, 1], xt = [], yt = [], xl = '', yl = '', grid = true, hide, zero = true, xfmt = v => v, yfmt = v => v } = o;
    const g = this.group({ hide });
    const X = v => box.x + (v - xr[0]) / (xr[1] - xr[0]) * box.w;
    const Y = v => box.y + box.h - (v - yr[0]) / (yr[1] - yr[0]) * box.h;
    if (grid) {
      for (const v of xt) sv('line', { x1: X(v), x2: X(v), y1: box.y, y2: box.y + box.h, class: 'gridline' }, g);
      for (const v of yt) sv('line', { y1: Y(v), y2: Y(v), x1: box.x, x2: box.x + box.w, class: 'gridline' }, g);
    }
    const y0 = (zero && yr[0] < 0 && yr[1] > 0) ? Y(0) : box.y + box.h;
    sv('line', { x1: box.x, x2: box.x + box.w, y1: y0, y2: y0, class: 'axis' }, g);
    sv('line', { x1: box.x, x2: box.x, y1: box.y, y2: box.y + box.h, class: 'axis' }, g);
    const corner = xt.includes(xr[0]) && yt.includes(yr[0]);
    for (const v of xt) if (!(corner && v === xr[0])) sv('text', { x: X(v), y: box.y + box.h + 34, 'text-anchor': 'middle', class: 'tick', text: String(xfmt(v)).replace('-', '−') }, g);
    for (const v of yt) sv('text', { x: box.x - 14, y: Y(v) + 8, 'text-anchor': 'end', class: 'tick', text: String(yfmt(v)).replace('-', '−') }, g);
    if (xl) sv('text', { x: box.x + box.w, y: box.y + box.h + 70, 'text-anchor': 'end', 'font-size': 26, class: 'muted', html: xl }, g);
    if (yl) sv('text', { x: box.x, y: box.y - 22, 'font-size': 26, class: 'muted', html: yl }, g);
    return { g, X, Y, box };
  },
  curve(fn, a, b, X, Y, n = 240, ylim) {
    let d = '', pen = false;
    for (let i = 0; i <= n; i++) {
      const x = a + (b - a) * i / n; let y = fn(x);
      if (!isFinite(y)) { pen = false; continue; }
      if (ylim) { if (y > ylim[1] || y < ylim[0]) { if (pen) { y = clamp(y, ylim[0], ylim[1]); d += `L${X(x).toFixed(1)},${Y(y).toFixed(1)}`; } pen = false; continue; } }
      d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ',' + Y(y).toFixed(1); pen = true;
    }
    return d;
  },
  /* atom: a soft sphere with highlight */
  atom(x, y, r, gas = 'ar', o = {}) {
    const g = this.group(o);
    this.place(g, x, y);
    sv('circle', { r, class: 'f-' + gas, opacity: .9 }, g);
    sv('circle', { r: r * .86, fill: 'none', stroke: 'white', 'stroke-opacity': .25, 'stroke-width': r * .08 }, g);
    sv('circle', { cx: -r * .35, cy: -r * .38, r: r * .22, fill: 'white', opacity: .35 }, g);
    return g;
  },
  card(x, y, w, h, o = {}) { return this.rect(x, y, w, h, { rx: 10, class: 'fill-paper stroke-rule', 'stroke-width': 2, ...o }); },
  /* multi-line text block, lines separated by \n */
  para(x, y, str, o = {}) {
    const { size = 30, lh = 1.35, ...rest } = o;
    const t = this.text(x, y, '', { size, ...rest });
    str.split('\n').forEach((ln, i) => sv('tspan', { x, dy: i ? size * lh : 0, html: scriptfix(ln) }, t));
    return t;
  }
};

/* stable id for a caption line (FNV-1a over UTF-16 code units) -> audio/<id>.m4a */
function lineHash(t) { let h = 0x811c9dc5; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
/* ---------- narration: browser speech with timed fallback ---------- */
const Narr = {
  on: store.get('voiceOn', true), rate: store.get('rate', 1), voice: null, ok: 'speechSynthesis' in window,
  init() {
    if (!this.ok) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      const en = vs.filter(v => /^en[-_]/i.test(v.lang));
      this.voice = en.find(v => /natural|neural|premium|enhanced/i.test(v.name))
        || en.find(v => /samantha|daniel|google us|google uk|aria|jenny|guy|serena|karen/i.test(v.name))
        || en[0] || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  readMs(text) { return (1100 + text.replace(/<[^>]+>/g, '').length * 62) / this.rate; },
  /* pre-rendered narration (audio/<lineHash>.m4a) when available, else browser speech */
  audio: null,
  sayRecorded(h, ms) {
    return new Promise(res => {
      const a = this.audio || (this.audio = new Audio());
      let done = false;
      const fin = () => { if (!done) { done = true; clearTimeout(t); a.onended = a.onerror = null; res(); } };
      a.onended = fin; a.onerror = () => { done = true; clearTimeout(t); res(this.on && this.ok ? 'fallback' : null); };
      a.src = 'audio/' + h + '.m4a';
      a.playbackRate = this.rate; try { a.preservesPitch = true; } catch (e) {}
      const t = setTimeout(fin, ms * 3 + 6000);
      P.cancelers.push(() => { try { a.pause(); } catch (e) {} fin(); });
      const pr = a.play(); if (pr && pr.catch) pr.catch(() => { if (!done) { done = true; clearTimeout(t); res('blocked'); } });
    });
  },
  say(text) {
    const h = lineHash(text);
    if (this.on && typeof AUDIO !== 'undefined' && AUDIO.has(h)) return this.sayRecorded(h, this.readMs(text)).then(r => r === 'blocked' ? new Promise(ok => { const t = setTimeout(ok, this.readMs(text)); P.cancelers.push(() => { clearTimeout(t); ok(); }); }) : r === 'fallback' ? this.saySynth(text) : null);
    return this.saySynth(text);
  },
  saySynth(text) {
    const plain = text.replace(/<[^>]+>/g, '').replace(/CCSDTQ\(P\)/g, 'even higher coupled-cluster levels').replace(/CCSDT\(Q\)/g, 'a higher coupled-cluster level').replace(/CCSD\(T\)/g, 'C C S D T').replace(/\b8Z\b/g, 'eight zeta').replace(/≈/g, ' about ').replace(/×/g, ' times ').replace(/−/g, 'minus ');
    return new Promise(res => {
      const ms = this.readMs(text);
      if (!this.on || !this.ok) { const t = setTimeout(res, ms); P.cancelers.push(() => { clearTimeout(t); res(); }); return; }
      try { speechSynthesis.cancel(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(plain);
      if (this.voice) u.voice = this.voice;
      u.lang = this.voice ? this.voice.lang : 'en-US'; u.rate = this.rate;
      let done = false;
      const fin = () => { if (!done) { done = true; clearTimeout(t); res(); } };
      u.onend = fin; u.onerror = fin;
      const t = setTimeout(fin, ms * 2.4 + 4000);
      P.cancelers.push(fin);
      speechSynthesis.speak(u);
    });
  },
  stop() { if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} if (this.audio) try { this.audio.pause(); } catch (e) {} }
};

/* ---------- player ---------- */
const P = { ch: null, i: 0, line: 0, acted: -1, playing: false, gen: 0, cancelers: [], score: {} };
function interrupt() { Narr.stop(); const c = P.cancelers; P.cancelers = []; c.forEach(f => f()); }
function beat() { return P.ch.beats[P.i]; }
function lines(b) { return (b.lines || []).map(l => Array.isArray(l) ? l : [l, null]); }

function gotoBeat(i, play = P.playing) {
  interrupt();
  if (P.cleanup) { try { P.cleanup(); } catch (e) {} P.cleanup = null; }
  P.gen++; S.gen = P.gen; S.fast = false;
  P.i = clamp(i, 0, P.ch.beats.length - 1); P.line = 0; P.acted = -1; P.playing = play;
  S.clear();
  const b = beat();
  S.g.removeAttribute('transform');
  try { b.scene && b.scene(S); } catch (e) { console.error(e); }
  if (b.shift) S.g.setAttribute('transform', `translate(${b.shift},0)`);
  const L = lines(b);
  setCaption(L.length ? L[0][0] : '', b);
  UI.sync();
  if (play || !L.length) run(P.gen);
}
async function run(gen) {
  const b = beat(), L = lines(b);
  while (P.line < L.length) {
    if (gen !== P.gen || !P.playing) return;
    const [text, act] = L[P.line];
    setCaption(text, b);
    let ap = null;
    if (P.acted !== P.line) {
      P.acted = P.line;
      if (act) ap = Promise.resolve().then(() => act(S)).catch(e => console.error(e));
    }
    await Promise.all([Narr.say(text), ap]);
    if (gen !== P.gen || !P.playing) return;
    P.line++;
  }
  if (gen !== P.gen) return;
  if (b.ask || b.explore) {
    if (b._asked !== gen) { b._asked = gen; await (b.ask ? ask(b.ask, gen) : explore(b, gen)); }
    else return;
    if (gen !== P.gen) return;
    if (P.i < P.ch.beats.length - 1) { gotoBeat(P.i + 1, true); }
    return;
  }
  if (P.playing && P.i < P.ch.beats.length - 1) { await S.wait(500); if (gen === P.gen && P.playing) gotoBeat(P.i + 1, true); }
  else if (P.i === P.ch.beats.length - 1) { P.playing = false; UI.sync(); }
}
function togglePlay() {
  if (P.playing) { P.playing = false; interrupt(); UI.sync(); return; }
  P.playing = true; UI.sync();
  const b = beat();
  if (P.line >= lines(b).length && !b.ask && !b.explore) { if (P.i < P.ch.beats.length - 1) gotoBeat(P.i + 1, true); else gotoBeat(0, true); return; }
  run(P.gen);
}
function setCaption(text, b) {
  const c = document.getElementById('caption'); if (!c) return;
  c.innerHTML = '';
  c.append(hx('span', { class: 'who' }, (b && b.label) || ''));
  c.append(hx('span', { html: text || (b && (b.ask || b.explore) ? '' : '') }));
}

/* ---------- questions ---------- */
function toPanel(card) {
  const pn = document.getElementById('panel');
  pn.append(card);
  try { const r = card.getBoundingClientRect(); if (r.bottom > innerHeight) card.scrollIntoView({ block: 'nearest', behavior: REDUCE ? 'auto' : 'smooth' }); } catch (e) {}
}
function ask(q, gen) {
  return new Promise(resolve => {
    const card = hx('div', { class: 'qcard', role: 'group', 'aria-label': 'Question' });
    card.append(hx('div', { class: 'qk' }, q.kind || 'Quick check'), hx('div', { class: 'qq', html: q.q }));
    toPanel(card);
    let tries = 0, solved = false;
    const fb = hx('div', { class: 'fb', hidden: true });
    const foot = hx('div', { class: 'row' });
    const record = ok => { if (!(q.id in P.score)) { P.score[q.id] = ok; saveScore(); } };
    const finish = (okFirst, why) => {
      solved = true;
      fb.hidden = false; fb.className = 'fb ok'; fb.innerHTML = why || q.why || 'Correct.';
      foot.replaceChildren(hx('button', { class: 'go', onclick: () => { card.remove(); cleanup(); resolve(); } }, 'Continue →'));
      if (q.onRight) Promise.resolve().then(() => q.onRight(S)).catch(console.error);
      if (P.ch) markProgress();
    };
    const wrong = (msg, reveal) => {
      tries++; record(false);
      fb.hidden = false; fb.className = 'fb no'; fb.innerHTML = msg || q.hint || 'Not quite. Look at the picture again.';
      if (tries >= 1 && !foot.querySelector('.ghost')) foot.append(hx('button', { class: 'go ghost', onclick: reveal }, 'Show answer'));
    };
    let cleanup = () => {};
    if (q.type === 'choice') {
      const opts = hx('div', { class: 'opts' });
      q.opts.forEach((o, k) => {
        const b = hx('button', { class: 'opt', html: o.t });
        b.onclick = () => {
          if (solved) return;
          if (o.ok) { b.classList.add('ok'); record(true); finish(true, o.why); }
          else { b.classList.add('no'); wrong(o.why, () => { const kk = q.opts.findIndex(z => z.ok); opts.children[kk].classList.add('ok'); finish(false, q.opts[kk].why); }); }
        };
        opts.append(b);
      });
      card.append(opts);
    } else if (q.type === 'num') {
      const inp = hx('input', { type: 'text', inputmode: 'decimal', id: 'q-' + q.id, 'aria-label': 'Your answer', autocomplete: 'off' });
      const check = () => {
        if (solved) return;
        const v = parseFloat(inp.value.replace(',', '.').replace('−', '-'));
        if (!isFinite(v)) { fb.hidden = false; fb.className = 'fb'; fb.textContent = 'Type a number.'; return; }
        const tol = q.tol != null ? q.tol : Math.abs(q.ans) * (q.rtol || 0.02);
        if (Math.abs(v - q.ans) <= tol) { record(true); finish(true); }
        else wrong(typeof q.hint === 'function' ? q.hint(v) : q.hint, () => { inp.value = q.ans; finish(false); });
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      card.append(hx('div', { class: 'row' }, inp, q.unit ? hx('span', { class: 'mono', html: q.unit }) : null, hx('button', { class: 'go', onclick: check }, 'Check')));
    } else if (q.type === 'pick') {
      const T = q.targets(S);
      const handlers = [];
      T.forEach(t => {
        t.el.classList.add('pick'); t.el.setAttribute('tabindex', 0); t.el.setAttribute('role', 'button');
        if (t.label) t.el.setAttribute('aria-label', t.label);
        const h = () => {
          if (solved) return;
          if (t.ok) { record(true); finish(true, t.why); }
          else wrong(t.why, () => { const k = T.find(z => z.ok); finish(false, k.why); });
        };
        const kh = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h(); } };
        t.el.addEventListener('click', h); t.el.addEventListener('keydown', kh);
        handlers.push(() => { t.el.removeEventListener('click', h); t.el.removeEventListener('keydown', kh); t.el.classList.remove('pick'); t.el.removeAttribute('tabindex'); });
      });
      cleanup = () => handlers.forEach(f => f());
      card.append(hx('div', { class: 'eyebrow' }, 'Click it in the picture'));
    }
    card.append(fb, foot);
    const first = card.querySelector('button.opt, input');
    if (first && !matchMedia('(hover:none)').matches) setTimeout(() => first.focus({ preventScroll: true }), 50);
  });
}
function explore(b, gen) {
  return new Promise(resolve => {
    const card = hx('div', { class: 'qcard' });
    card.append(hx('div', { class: 'qk' }, 'Try it'), hx('div', { class: 'qq', html: b.explore.title }));
    const body = hx('div', { class: 'sliders' });
    card.append(body);
    toPanel(card);
    let cleanup;
    try { cleanup = b.explore.build(S, body, slider); } catch (e) { console.error(e); }
    P.cleanup = cleanup || null;
    card.append(hx('div', { class: 'row' }, hx('button', { class: 'go', onclick: () => { cleanup && cleanup(); P.cleanup = null; card.remove(); resolve(); } }, 'Continue →')));

}
function slider(parent, o) {
  const id = 'sl-' + o.id;
  const out = hx('span', {});
  const inp = hx('input', { type: 'range', id, min: o.min, max: o.max, step: o.step || (o.max - o.min) / 200, value: o.value });
  const lab = hx('label', { for: id }, hx('span', { html: o.label }), out);
  const upd = () => { const v = +inp.value; out.innerHTML = o.show ? o.show(v) : v; o.onInput(v); };
  inp.addEventListener('input', upd);

}

/* ---------- progress and score ---------- */
function saveScore() { const all = store.get('score', {}); all[P.ch.id] = P.score; store.set('score', all); }
function markProgress() { const pr = store.get('progress', {}); pr[P.ch.id] = Math.max(pr[P.ch.id] || 0, P.i / (P.ch.beats.length - 1)); store.set('progress', pr); }

function finishBeat() {
  return {
    id: 'finish', label: 'Score',
    scene(S) {
      const ids = Object.keys(P.score);
      const right = ids.filter(k => P.score[k]).length;
      S.text(800, 250, 'Chapter complete', { size: 70, cls: 't-disp', anchor: 'middle' });
      S.text(800, 330, ids.length ? `First-try answers: ${right} of ${ids.length}` : 'No questions answered this time', { size: 34, cls: 'muted', anchor: 'middle' });
      const total = ids.length || 1;
      ids.forEach((k, j) => S.circle(800 + (j - (ids.length - 1) / 2) * 56, 420, 20, { class: P.score[k] ? 'f-good' : 'f-bad', opacity: .9 }));
      const pr = store.get('progress', {}); pr[P.ch.id] = 1; store.set('progress', pr);
      const nx = CH[CH.indexOf(P.ch) + 1];
      const box = hx('div', { class: 'qcard' });
      box.append(hx('div', { class: 'qq' }, nx ? 'Next: ' + nx.title : 'You reached the end of the course.'));
      const row = hx('div', { class: 'row' });
      if (nx) row.append(hx('a', { class: 'go', href: '#' + nx.id, style: 'text-decoration:none' }, 'Start chapter ' + nx.n + ' →'));
      row.append(hx('a', { class: 'go ghost', href: '#papers', style: 'text-decoration:none' }, 'Read the papers'));
      row.append(hx('button', { class: 'go ghost', onclick: () => { P.score = {}; saveScore(); gotoBeat(0, false); } }, 'Replay chapter'));
      box.append(row); toPanel(box);
    },

}

<script>
/* ===================== physics helpers (reduced units: r in σ, energy in ε) ===================== */
const PHYS = {
  lj: r => 4 * (Math.pow(r, -12) - Math.pow(r, -6)),
  ljF: r => 24 * (2 * Math.pow(r, -13) - Math.pow(r, -7)),   // −dV/dr
  /* reduced second virial coefficient B* = B / (2π/3 σ³ N_A) for Lennard-Jones at reduced T* = kT/ε */
  B2: (T, V = PHYS.lj) => {
    let s = 0; const n = 1200, a = 0.3, b = 8, h = (b - a) / n;
    for (let i = 0; i <= n; i++) {
      const r = a + i * h, f = (Math.exp(-V(r) / T) - 1) * r * r;
      s += f * (i === 0 || i === n ? 1 : i % 2 ? 4 : 2);
    }
    s *= h / 3;
    s += -V(b) * b * b * b / (3 * T);   // r^-6 tail beyond the grid
    return -3 * (s + (-(a * a * a) / 3));   // inside r<a the Mayer function is −1
  },
  /* classical relative trajectory in the plane: impact parameter b (σ), reduced energy E (ε) */
  trajectory(b, E, V = PHYS.lj, F = PHYS.ljF) {
    const v0 = Math.sqrt(2 * E);          // reduced mass = 1
    let x = -5, y = b, vx = v0, vy = 0;
    const pts = [[x, y]];
    const acc = (x, y) => { const r = Math.hypot(x, y); const f = F(Math.max(r, 0.5)) / r; return [f * x, f * y]; };
    let [ax, ay] = acc(x, y);
    let aPrev = 0, chiAcc = 0;                // accumulated rotation of the velocity (counts orbits)
    const dt = 0.004 / Math.max(1, v0);
    for (let k = 0; k < 60000; k++) {
      x += vx * dt + .5 * ax * dt * dt; y += vy * dt + .5 * ay * dt * dt;
      const [nx, ny] = acc(x, y);
      vx += .5 * (ax + nx) * dt; vy += .5 * (ay + ny) * dt; ax = nx; ay = ny;
      { const a = Math.atan2(vy, vx); let d = a - aPrev; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; chiAcc += d; aPrev = a; }
      if (k % 10 === 0) pts.push([x, y]);
      if (Math.hypot(x, y) > 5.5 && x * vx + y * vy > 0) break;
    }
    pts.push([x, y]);
    const chi = chiAcc;   // deflection angle (radians), negative = pulled toward partner; |χ| > π means orbiting
    return { pts, chi };
  },
  /* CO2 pair, rigid three-site model: Lennard-Jones sites + point charges (TraPPE parameters).
     A at the origin along x; B's centre at distance d (nm), position angle phi, axis angle th (radians). Energy in K. */
  co2Sites: (cx, cy, th) => { const L = 0.116, c = Math.cos(th), s = Math.sin(th); return [['O', cx - L * c, cy - L * s], ['C', cx, cy], ['O', cx + L * c, cy + L * s]]; },
  co2E(d, phi, th) {
    const P = { C: { s: 0.280, e: 27, q: 0.70 }, O: { s: 0.305, e: 79, q: -0.35 } }, KC = 16710.1;   // e²/(4πε₀k_B) in K·nm
    const A = PHYS.co2Sites(0, 0, 0), B = PHYS.co2Sites(d * Math.cos(phi), d * Math.sin(phi), th);
    let u = 0;
    for (const [a, ax, ay] of A) for (const [b, bx, by] of B) {
      const r = Math.hypot(ax - bx, ay - by), sg = (P[a].s + P[b].s) / 2, ep = Math.sqrt(P[a].e * P[b].e), x = Math.pow(sg / r, 6);
      u += 4 * ep * (x * x - x) + KC * P[a].q * P[b].q / r;
    }
    return u;
  },
  co2Best(phi, th) { let b = [0.8, PHYS.co2E(0.8, phi, th)]; for (let d = 0.28; d <= 0.8; d += 0.004) { const v = PHYS.co2E(d, phi, th); if (v < b[1]) b = [d, v]; } return b; },
  /* third virial coefficient of the Lennard-Jones model (reduced: σ = 1, T* = k_B T/ε): two Monte Carlo estimators */
  msmc(T) {
    const f = r2 => { const r6 = 1 / (r2 * r2 * r2); return Math.exp(-4 * (r6 * r6 - r6) / T) - 1; };
    const fhs = r2 => r2 < 1 ? -1 : 0;
    const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
    const gam = (p2, p3) => f(d2([0, 0, 0], p2)) * f(d2([0, 0, 0], p3)) * f(d2(p2, p3));
    const gamHS = (p2, p3) => fhs(d2([0, 0, 0], p2)) * fhs(d2([0, 0, 0], p3)) * fhs(d2(p2, p3));
    const B3HS = 5 / 8 * Math.pow(2 * Math.PI / 3, 2);       // hard spheres, σ = 1
    let seed = 12345; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const L = 3, V = Math.pow(2 * L, 3);                      // plain MC: positions uniform in a cube of side 2L
    const st = { nP: 0, sumP: 0, sumP2: 0, nM: 0, sumS: 0, sumH: 0, p2: [1.05, 0, 0], p3: [0.52, 0.9, 0], g: 0, lastP: [], lastM: [] };
    st.g = gam(st.p2, st.p3);
    st.stepPlain = n => { for (let i = 0; i < n; i++) { const p2 = [L * (2 * rnd() - 1), L * (2 * rnd() - 1), L * (2 * rnd() - 1)], p3 = [L * (2 * rnd() - 1), L * (2 * rnd() - 1), L * (2 * rnd() - 1)]; const v = gam(p2, p3); st.nP++; st.sumP += v; st.sumP2 += v * v; if (i % 4 === 0) { st.lastP.push(p2, p3); if (st.lastP.length > 400) st.lastP.splice(0, 2); } } };
    st.stepMayer = n => { for (let i = 0; i < n; i++) { const which = rnd() < .5 ? 'p2' : 'p3', old = st[which], trial = old.map(c => c + 0.5 * (2 * rnd() - 1)); const save = st[which]; st[which] = trial; const g = gam(st.p2, st.p3); if (Math.abs(g) >= Math.abs(st.g) * rnd()) st.g = g; else st[which] = save; const pi = Math.abs(st.g) || 1e-300; st.nM++; st.sumS += st.g / pi; st.sumH += gamHS(st.p2, st.p3) / pi; if (i % 4 === 0) { st.lastM.push(st.p2.slice(), st.p3.slice()); if (st.lastM.length > 400) st.lastM.splice(0, 2); } } };
    st.plain = () => st.nP ? -(1 / 3) * V * V * st.sumP / st.nP : NaN;
    st.plainErr = () => { if (st.nP < 2) return NaN; const m = st.sumP / st.nP, va = st.sumP2 / st.nP - m * m; return (1 / 3) * V * V * Math.sqrt(Math.max(va, 0) / st.nP); };
    st.mayer = () => st.nM && st.sumH ? B3HS * st.sumS / st.sumH : NaN;
    return st;
  },
  /* Axilrod–Teller–Muto angular/radial factor for three atoms (any length unit) */
  atm(p1, p2, p3) {
    const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    const r12 = d(p1, p2), r13 = d(p1, p3), r23 = d(p2, p3);
    const c1 = (r12 * r12 + r13 * r13 - r23 * r23) / (2 * r12 * r13), c2 = (r12 * r12 + r23 * r23 - r13 * r13) / (2 * r12 * r23), c3 = (r13 * r13 + r23 * r23 - r12 * r12) / (2 * r13 * r23);
    return (1 + 3 * c1 * c2 * c3) / Math.pow(r12 * r13 * r23, 3);
  }
};

    ['Pair potential', 'The energy of two molecules as a function of their distance (and, for molecules, their orientation). Every gas property in this course follows from it.'],

    ['Coupled cluster, CCSD(T)', 'The standard high-accuracy method, often called the gold standard. Hellmann adds even higher levels such as CCSDT(Q) on top of it.'],

    ['Dispersion (London) force', 'Attraction from synchronised flickers of the electron clouds. It falls off as 1/<i>R</i>⁶.'],
    ['Pauli repulsion', 'Electron clouds of closed-shell atoms cannot overlap without a steep energy cost.'],
    ['Well depth <i>ε</i>', 'How far the pair potential dips below zero at its minimum. Usually quoted as <i>ε</i>/<i>k</i><sub>B</sub> in kelvin, i.e. the energy divided by the Boltzmann constant <i>k</i><sub>B</sub>.'],

    ['Mayer function', '<i>f</i>(<i>R</i>) = exp(−<i>V</i>/<i>k</i><sub>B</sub><i>T</i>) − 1: how much more (or less) likely a pair is to be found at distance <i>R</i> than without forces.'],

<script>
/* small drawing helpers for molecules */
function linMol(S, x, y, ang, o = {}) {           // CO2-like: O=C=O, length ~ 2×bond
  const { L = 70, rO = 30, rC = 26, parent, charges } = o;
  const g = S.group({ parent }); S.place(g, x, y); g.setAttribute('transform', `translate(${x},${y}) rotate(${ang})`);
  S.line(-L, 0, L, 0, { w: 10, cls: 'muted', style: 'stroke:var(--ink-2)', parent: g });
  S.circle(-L, 0, rO, { class: 'f-ne', opacity: .9, parent: g });
  S.circle(L, 0, rO, { class: 'f-ne', opacity: .9, parent: g });
  S.circle(0, 0, rC, { class: 'f-kr', parent: g });
  if (charges) {
    const c = Math.cos(ang * Math.PI / 180), sn = Math.sin(ang * Math.PI / 180);
    const lab = S.group({ parent }); g._labels = lab;
    [[-L, 'δ−', 24], [L, 'δ−', 24], [0, 'δ+', 20]].forEach(([d, t, z]) => S.text(x + d * c, y + d * sn + 9, t, { size: z, anchor: 'middle', fill: 'white', weight: 600, parent: lab }));
  }
  return g;
}
function waterMol(S, x, y, ang, parent) {
  const g = S.group({ parent }); g.setAttribute('transform', `translate(${x},${y}) rotate(${ang})`);
  S.line(0, 0, -38, 30, { w: 8, cls: 'muted', style: 'stroke:var(--ink-2)', parent: g });
  S.line(0, 0, 38, 30, { w: 8, cls: 'muted', style: 'stroke:var(--ink-2)', parent: g });

  S.circle(-38, 30, 16, { class: 'f-kr', parent: g }); S.circle(38, 30, 16, { class: 'f-kr', parent: g });
  return g;
}

    { a: 'Hellmann', y: 2013, t: 'Ab initio potential energy surface for the nitrogen molecule pair and thermophysical properties of nitrogen gas', j: 'Mol. Phys. 111, 387', doi: '10.1080/00268976.2012.726379', why: 'Nitrogen, the main component of air; shows the semi-empirical fine-tuning step.' },

      const v = vis(t, [CUE.curve[0] - .6, CUE.curve[1] + .8], .8, .8), p = ease(cl(ph(t, CUE.curve) * 1.6));
      const eq = ['Ĥ Ψ = E Ψ', 'CCSD(T)', '−1055.183 47 Eₕ', 'V(R)', 'Born–Oppenheimer', 'CCSDTQ(P)', 'basis set → CBS', 'BSSE'];
      eq.forEach((s, k) => text(c, s, 200 + (k * 211) % 1250, 160 + (k * 137) % 600 + Math.sin(t * .6 + k) * 14, 26 + (k % 3) * 8, C.dim, .25 * v, { font: '"IBM Plex Mono", monospace' }));
      c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = hexA(C.amber, .9 * v); c.lineWidth = 5; c.shadowColor = C.amber; c.shadowBlur = 28;

    // 3 · collision storm

      const v = vis(t, [CUE.storm[0] - .6, CUE.storm[1] + .8], .6, .9), p = ph(t, CUE.storm);
      c.save(); c.translate(800, 450); c.rotate(-.25 + p * .5); const sc = 92 + p * 40; c.globalCompositeOperation = 'lighter';
      a.traj.forEach((tr, k) => {

        c.beginPath(); for (let i = 0; i < n; i++) { const [x, y] = tr.pts[i]; i ? c.lineTo(x * sc, y * sc * tr.side) : c.moveTo(x * sc, y * sc * tr.side); } c.stroke();

    }
    // 4 · three-body field with an orbiting third atom
    if (t > CUE.three[0] - .6 && t < CUE.three[1] + .8) {
      const v = vis(t, [CUE.three[0] - .6, CUE.three[1] + .8], .9, .8), p = ph(t, CUE.three);
      c.save(); c.globalAlpha = v * cl(p * 3); c.imageSmoothingEnabled = true; c.globalCompositeOperation = 'lighter'; c.drawImage(a.field, 0, 0, 1600, 900); c.restore();
      const ang = -Math.PI / 2 + p * Math.PI * 1.6, x3 = 800 + 330 * Math.cos(ang), y3 = 450 + 230 * Math.sin(ang);
      c.save(); c.strokeStyle = hexA(C.ink, .3 * v); c.setLineDash([5, 9]); c.lineWidth = 2; c.beginPath(); c.moveTo(800 - 104, 450); c.lineTo(800 + 104, 450); c.lineTo(x3, y3); c.closePath(); c.stroke(); c.restore();

      const v = vis(t, [CUE.quantum[0] - .6, CUE.quantum[1] + .8], .7, .8), p = ph(t, CUE.quantum);
      for (let m = 0; m < 3; m++) {
        const cx = 360 + m * 220, cy = 450 + Math.sin(t * 1.3 + m) * 30, R = 70 * (1.2 - .6 * p) * (1 + .15 * Math.sin(t * 3 + m));

      const P = (x, y) => [180 + x * 680, 760 - y * 520];
      c.save(); c.globalAlpha = .4 * v; c.strokeStyle = C.dim; c.lineWidth = 1.5; c.beginPath(); c.moveTo(...P(0, 1)); c.lineTo(...P(0, 0)); c.lineTo(...P(1, 0)); c.stroke(); c.restore();
      const q = ease(cl(p * 1.8)); c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = hexA(C.violet, .95 * v); c.lineWidth = 5; c.shadowColor = C.violet; c.shadowBlur = 24; c.beginPath();
      for (let i = 0; i <= 100 * q; i++) { const x = .05 + i / 100 * .55, y = .08 + Math.pow(i / 100, 2.2) * .62; const [X, Y] = P(x, y); i ? c.lineTo(X, Y) : c.moveTo(X, Y); } c.stroke(); c.restore();
      if (p > .55) { const f = cl((p - .55) * 4), [X, Y] = P(.6, .7); c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = hexA(C.amber, .12 * f * v); c.fillRect(X, 760 - 520, 860 - X, Y - 240); c.restore(); glowAtom(c, X, Y, 12 + 40 * f * (1 - cl((p - .75) * 3)), C.amber, v); text(c, 'supercritical', X + 120, Y - 50, 30, C.amber, v * f, { italic: 1 }); }
      const g = ease(cl((p - .15) * 1.4));
      c.save(); c.globalCompositeOperation = 'lighter'; for (const s of a.parts) glowAtom(c, s.x0 + (s.x1 - s.x0) * g, s.y0 + (s.y1 - s.y0) * g, 5, C.teal, v * .8); c.restore();
    }
    // 7 · kinetic typography: the numbers
    if (t > CUE.numbers[0] - .2 && t < CUE.numbers[1] + .5) {
      const span = (CUE.numbers[1] - CUE.numbers[0]) / 3;
      const items = [['±0.51 K', 'krypton’s well depth'], ['0.003 %', 'neon’s polarizability'], ['10 × better', 'than measuring helium']];
      items.forEach(([big, small], k) => {
        const t0 = CUE.numbers[0] + k * span, q = (t - t0) / span; if (q < 0 || q > 1.15) return;
        const slam = 1 + 1.4 * Math.pow(1 - cl(q * 5), 3), a2 = cl(q * 8) * cl((1.1 - q) * 6);
        if (q < .12) { c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(242,166,90,${.25 * (1 - q / .12)})`; c.fillRect(0, 0, 1600, 900); c.restore(); }
        c.save(); c.translate(800, 420); c.scale(slam, slam); text(c, big, 0, 0, 170, C.ink, a2, { weight: 600, glow: C.amber, blur: 40 }); c.restore();
        text(c, small, 800, 560, 34, C.amber, a2 * cl((q - .15) * 6), { font: '"IBM Plex Mono", monospace', spacing: 3 });
      });
    }
    // 8 · title card
    if (t > CUE.title[0] - .4) {
      const p = ph(t, CUE.title), v = cl(p * 3);

      text(c, 'Gases from First Principles', 800, 450, 104, C.ink, v, { glow: C.amber, blur: 24 + 18 * Math.sin(t * 2), spacing: 4 * (1 - ease(cl(p * 2))) });
      text(c, 'An animated course through the research of Robert Hellmann', 800, 540, 34, C.dim, cl(p * 3 - .6), { italic: 1 });
      text(c, '10 CHAPTERS  ·  NARRATED  ·  INTERACTIVE', 800, 610, 24, C.amber, cl(p * 3 - 1.1), { font: '"IBM Plex Mono", monospace', spacing: 5 });
    }
    // subtitles
    for (const [a1, a2, s, kind] of TEXT) {

  }

  /* ---------- player ---------- */

})();

      hx('button', { class: 'tbtn', 'aria-label': 'Previous step', onclick: () => gotoBeat(P.i - 1, P.playing) }, '⏮'),
      hx('button', { class: 'tbtn primary', id: 'playbtn', onclick: togglePlay }, '▶ Play'),
      hx('button', { class: 'tbtn', 'aria-label': 'Next step', onclick: () => gotoBeat(P.i + 1, P.playing) }, '⏭'),
      hx('button', { class: 'tbtn', 'aria-label': 'Replay this step', onclick: () => gotoBeat(P.i, true) }, '↺'),
      beatsBar,
      hx('span', { class: 'beatname', id: 'beatname' }),
      voiceBtn, rateBtn),
    hx('div', { class: 'caption', id: 'caption', 'aria-live': 'polite' }),
    hx('div', { class: 'below' },
      hx('div', { class: 'prose' },
        hx('h3', { style: 'font-size:20px;margin-bottom:8px' }, 'About this chapter'),
        hx('div', { html: ch.about })),
      hx('div', { class: 'card' },
        hx('h3', {}, 'Papers behind it'),
        hx('ol', {}, ...ch.papers.slice(0, 4).map(pp => hx('li', { html: `${pp.doi ? `<a href="https://doi.org/${pp.doi}" target="_blank" rel="noopener">${pp.t}</a>` : pp.t} <span>${pp.a}, ${pp.j} (${pp.y})</span>` }))),
        hx('p', { style: 'font-size:12.5px;color:var(--ink-2);margin:12px 0 0', html: 'Keys: <span class="kbd">Space</span> play/pause · <span class="kbd">←</span><span class="kbd">→</span> steps' }))));

  keyHandler = e => {
    if (e.target.closest('input,textarea,select')) return;
    if (e.key === ' ' && !e.target.closest('button,a,[role=button]')) { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') gotoBeat(P.i + 1, P.playing);
    else if (e.key === 'ArrowLeft') gotoBeat(P.i - 1, P.playing);
  };
  document.addEventListener('keydown', keyHandler);
  window.scrollTo(0, 0);
  gotoBeat(0, false);
}

function route() {
  const id = (location.hash || '').slice(1);
  const ch = CH.find(c => c.id === id);
  if (ch) renderLesson(ch);
  else renderHome(['chapters', 'research', 'papers', 'glossary'].includes(id) ? id : null);
}
window.addEventListener('hashchange', route);
(() => { const t = store.get('theme', null); if (t) document.documentElement.dataset.theme = t; })();
Narr.init();
route();
</script>
</body>
</html>
